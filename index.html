<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8CCBEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="펭귄런">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>뒤뚱 펭귄런</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#7FC2E6; --sky-mid:#BFE3F3; --horizon:#DDF1FA;
  --ink:#1D3552; --muted:#56708C;
  --panel:#FFFFFF; --panel-ink:#1D3552; --panel-line:#D7E8F2;
  --btn:#FFD24F; --btn-ink:#3B2600; --btn-edge:#E0A821;
  --btn2:#FFFFFF; --btn2-ink:#1D3552; --btn2-edge:#B9D6E8;
  --pink:#FF6F98; --gold:#F5B731; --chip:#FFFFFFE6;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --sheet-h:min(50vh,430px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#17314C; --panel-ink:#EAF4FB; --panel-line:#2C4D6D; --muted:#A9C2D8;
    --btn2:#22426A; --btn2-ink:#EAF4FB; --btn2-edge:#173352; --chip:#17314CE6; --ink:#EAF4FB;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --panel:#17314C; --panel-ink:#EAF4FB; --panel-line:#2C4D6D; --muted:#A9C2D8;
  --btn2:#22426A; --btn2-ink:#EAF4FB; --btn2-edge:#173352; --chip:#17314CE6; --ink:#EAF4FB;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--horizon);font-family:var(--font);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#sky{position:fixed;inset:0;background:linear-gradient(to bottom,var(--sky-top) 0%,var(--sky-mid) 34%,var(--horizon) 52%,var(--horizon) 100%);overflow:hidden}
#sky i{position:absolute;background:#fff;border-radius:50%;filter:blur(6px);opacity:.85;
  animation:drift 26s ease-in-out infinite alternate}
#sky i:nth-child(2){animation-duration:34s;animation-delay:-8s}
#sky i:nth-child(3){animation-duration:30s;animation-delay:-15s}
#sky i:nth-child(4){animation-duration:38s;animation-delay:-4s}
@keyframes drift{from{transform:translateX(-5vw)}to{transform:translateX(5vw)}}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
.screen.show{display:flex}
.dim{background:#0E2A4566;justify-content:center}
button{font-family:var(--font);cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.btn{width:min(100%,340px);border-radius:22px;font-size:24px;padding:16px 18px 14px;
  background:var(--btn);color:var(--btn-ink);box-shadow:0 6px 0 var(--btn-edge);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--btn-edge)}
.btn.big{font-size:28px;padding:18px}
.btn.second{background:var(--btn2);color:var(--btn2-ink);box-shadow:0 6px 0 var(--btn2-edge);font-size:22px}
.btn.small{width:auto;font-size:18px;padding:10px 16px 8px;border-radius:16px}
.btn:disabled{filter:grayscale(.65);opacity:.55;cursor:default}
.btn + .btn{margin-top:14px}
.icon-btn{width:48px;height:48px;border-radius:16px;background:var(--chip);font-size:22px;color:var(--ink);box-shadow:0 3px 0 #0000001a}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);color:var(--ink);border-radius:999px;padding:8px 14px 6px;font-size:18px}
.chip b{font-weight:400;font-size:22px}
.coin{display:inline-block;width:1.05em;height:1.05em;border-radius:50%;flex:none;
  background:radial-gradient(circle at 34% 30%,#FFF2BF 0 14%,#FFD45C 30%,#F2AE1F 70%,#C98612 100%);box-shadow:inset 0 0 0 .1em #E6A11F}

/* loading */
#loading{justify-content:center;gap:12px;font-size:22px;color:#1D3552}
#loading .load-peng{font-size:64px;animation:waddle .5s ease-in-out infinite alternate}
#loading .lbar{width:180px;height:12px;border-radius:9px;background:#ffffffaa;overflow:hidden}
#loading .lbar i{display:block;height:100%;width:0;background:var(--gold);border-radius:9px;transition:width .2s}

/* start */
#start{justify-content:space-between}
.title{margin:4vh 0 0;display:flex;flex-direction:column;align-items:center;line-height:.92;font-weight:400;color:#fff;
  text-shadow:0 0 0 #1D3552,4px 0 0 #1D3552,-4px 0 0 #1D3552,0 4px 0 #1D3552,0 -4px 0 #1D3552,3px 3px 0 #1D3552,-3px 3px 0 #1D3552,3px -3px 0 #1D3552,-3px -3px 0 #1D3552,0 10px 0 #1D3552}
.title .t1{font-size:clamp(64px,22vw,112px);display:flex}
.title .t1 span{display:inline-block;transform-origin:50% 90%;animation:waddle .9s ease-in-out infinite alternate}
.title .t1 span:nth-child(2){animation-delay:-.45s}
.title .t2{font-size:clamp(46px,15vw,80px);color:#FFD24F;margin-top:4px}
@keyframes waddle{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.start-bottom{width:100%;display:flex;flex-direction:column;align-items:center}
.stats{display:flex;gap:10px;margin-bottom:18px}
.hint{margin:16px 0 0;font-size:16px;color:#1D3552;opacity:.8;text-align:center}
.hint.locked{opacity:1;background:var(--chip);color:var(--ink);border-radius:16px;padding:10px 14px 8px;line-height:1.45}
.sound{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px}
.credit{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);font-family:system-ui,sans-serif;font-size:10px;color:#1D3552;opacity:.6}

/* hud */
#hud{pointer-events:none;touch-action:none}
#hud button{pointer-events:auto}
.hud-top{width:100%;display:flex;align-items:flex-start;justify-content:space-between}
.dist{font-size:54px;color:#fff;line-height:1;text-shadow:0 0 0 #1D3552,3px 0 0 #1D3552,-3px 0 0 #1D3552,0 3px 0 #1D3552,0 -3px 0 #1D3552,0 6px 0 #1D3552}
.dist small{font-size:26px;margin-left:2px}
.hud-best{margin-top:6px;font-size:16px;color:#1D3552;background:#ffffffb3;border-radius:999px;padding:4px 12px 2px}
.slip{margin-top:16px;display:none;flex-direction:column;align-items:center;gap:6px;font-size:22px;color:#fff;
  text-shadow:0 0 0 #B8324F,2px 0 0 #B8324F,-2px 0 0 #B8324F,0 2px 0 #B8324F,0 -2px 0 #B8324F}
.slip.show{display:flex}
.slip .bar{width:180px;height:14px;border-radius:9px;background:#ffffffaa;overflow:hidden;box-shadow:inset 0 0 0 2px #B8324F55}
.slip .bar i{display:block;height:100%;width:100%;background:var(--pink)}
.pop{position:fixed;left:50%;top:44%;transform:translate(-50%,0);font-size:34px;color:#fff;opacity:0;pointer-events:none;
  text-shadow:0 0 0 #A4690B,3px 0 0 #A4690B,-3px 0 0 #A4690B,0 3px 0 #A4690B,0 -3px 0 #A4690B;white-space:nowrap}
.pop.go{animation:pop .9s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}

/* panels */
.panel{width:min(100%,360px);background:var(--panel);color:var(--panel-ink);border-radius:28px;padding:26px 22px 24px;
  display:flex;flex-direction:column;align-items:center;box-shadow:0 10px 0 #0E2A4533}
.panel h2{margin:0 0 6px;font-weight:400;font-size:34px}
.badge{display:none;background:var(--pink);color:#fff;border-radius:999px;padding:6px 14px 4px;font-size:18px;margin:4px 0 2px;transform:rotate(-3deg)}
.badge.show{display:inline-block}
.o-dist{font-size:72px;line-height:1.05;margin:6px 0 10px}
.o-dist small{font-size:30px;margin-left:2px}
.o-rows{width:100%;margin:0 0 20px;padding:0}
.o-rows div{display:flex;justify-content:space-between;align-items:center;border-top:2px dashed var(--panel-line);padding:10px 4px 8px;font-size:20px}
.o-rows dt{color:var(--muted)}
.o-rows dd{margin:0;display:flex;align-items:center;gap:6px}
.o-energy{margin:0 0 14px;font-size:16px;color:var(--muted);text-align:center;line-height:1.45}

/* shop */
.shop-top{width:100%;display:flex;justify-content:space-between;align-items:center}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);color:var(--panel-ink);border-radius:28px 28px 0 0;
  padding:16px 14px calc(env(safe-area-inset-bottom,0px) + 16px);box-shadow:0 -6px 0 #0E2A451a;height:var(--sheet-h);display:flex;flex-direction:column}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--panel-line);border-radius:18px;padding:5px;flex:none}
.tabs button{background:transparent;color:var(--panel-ink);border-radius:14px;padding:10px 0 8px;font-size:17px}
.tabs button[aria-selected="true"]{background:var(--panel);box-shadow:0 2px 0 #0000001a}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 2px 2px;align-content:start;touch-action:pan-y}
.item{background:var(--panel);color:var(--panel-ink);border:2px solid var(--panel-line);border-radius:20px;padding:12px 4px 10px;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-size:16px}
.item .ic{font-size:34px;line-height:1.1}
.item .st{font-size:15px;color:var(--muted);display:flex;align-items:center;gap:4px}
.item.on{border-color:var(--pink);background:color-mix(in srgb,var(--pink) 12%,var(--panel))}
.item.on .st{color:var(--pink)}
.item.poor{opacity:.5}
.item.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.toast{position:fixed;left:50%;bottom:calc(var(--sheet-h) + 14px);transform:translateX(-50%);background:var(--panel);color:var(--panel-ink);
  border-radius:999px;padding:10px 18px 8px;font-size:18px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 0 #0E2A4522}
.toast.show{opacity:1}
/* 짧은 가로 화면: 제목/버튼이 넘쳐 시작 버튼이 화면 밖으로 나간다 */
@media (orientation:landscape) and (max-height:520px){
  :root{--sheet-h:min(74vh,430px)}
  .title{margin-top:0}
  .title .t1{font-size:44px}
  .title .t2{font-size:32px}
  .stats{margin-bottom:8px}
  .chip{padding:5px 12px 4px;font-size:16px}
  .chip b{font-size:19px}
  .btn{border-radius:16px;font-size:19px;padding:10px 16px 8px}
  .btn.big{font-size:21px;padding:11px}
  .btn.second{font-size:18px}
  .btn + .btn{margin-top:8px}
  .hint{margin-top:8px;font-size:14px}
  .panel{padding:16px 18px 14px;border-radius:20px}
  .panel h2{font-size:24px}
  .o-dist{font-size:44px;margin:2px 0 6px}
  .o-dist small{font-size:20px}
  .o-rows{margin-bottom:10px}
  .o-rows div{padding:5px 4px 4px;font-size:17px}
  .o-energy{margin-bottom:8px;font-size:14px}
}
@media (prefers-reduced-motion: reduce){
  .title .t1 span,#loading .load-peng,#sky i,.item.shake{animation:none}
}
</style>
</head>
<body>
<div id="sky"><i style="left:6%;top:9%;width:120px;height:34px"></i><i style="left:58%;top:6%;width:160px;height:40px"></i><i style="left:30%;top:22%;width:90px;height:26px"></i><i style="left:78%;top:26%;width:110px;height:28px"></i></div>
<canvas id="c" aria-label="게임 화면"></canvas>

<section id="loading" class="screen show"><div class="load-peng">🐧</div><p>펭귄 깨우는 중…</p><div class="lbar"><i id="lbar"></i></div></section>

<section id="start" class="screen">
  <h1 class="title" aria-label="뒤뚱 펭귄런"><span class="t1"><span>뒤</span><span>뚱</span></span><span class="t2">펭귄런</span></h1>
  <div class="start-bottom">
    <div class="stats"><div class="chip">최고 기록 <b id="sBest">0</b>m</div><div class="chip"><i class="coin"></i><b id="sCoins">0</b></div></div>
    <div class="stats"><div class="chip">오늘 남은 판 <b id="sEnergy">●●●</b></div></div>
    <button id="btnPlay" class="btn big">달리기 시작</button>
    <button id="btnShop" class="btn second">펭귄 꾸미기</button>
    <p class="hint" id="hint">옆으로 쓸면 줄 바꾸기 · 톡 누르면 점프<br>아래로 쓸면 슬라이딩</p>
  </div>
  <button id="btnSound" class="icon-btn sound" aria-label="소리 끄기">🔊</button>
  <small class="credit">3D models made with Meshy AI (CC BY 4.0)</small>
</section>

<section id="hud" class="screen">
  <div class="hud-top">
    <button id="btnPause" class="icon-btn" aria-label="잠깐 멈추기">⏸</button>
    <div class="dist"><span id="hDist">0</span><small>m</small></div>
    <div class="chip"><i class="coin"></i><b id="hCoins">0</b></div>
  </div>
  <div class="hud-best">최고 <span id="hBest">0</span>m</div>
  <div id="slip" class="slip"><span>미끄덩! 5초만 버텨!</span><div class="bar"><i id="slipBar"></i></div></div>
  <div id="pop" class="pop"></div>
</section>

<section id="pause" class="screen dim"><div class="panel"><h2>잠깐 쉬는 중</h2><p style="margin:0 0 18px;color:var(--muted)">준비되면 다시 달려요</p>
  <button id="btnResume" class="btn big">계속 달리기</button><button id="btnQuit" class="btn second">처음으로</button></div></section>

<section id="over" class="screen dim"><div class="panel">
  <h2>꽈당! 넘어졌어</h2><div id="oNew" class="badge">새 기록!</div>
  <div class="o-dist"><span id="oDist">0</span><small>m</small></div>
  <dl class="o-rows"><div><dt>최고 기록</dt><dd><span id="oBest">0</span>m</dd></div><div><dt>이번에 얻은 코인</dt><dd><i class="coin"></i><span id="oCoins">0</span></dd></div></dl>
  <p id="oEnergy" class="o-energy"></p>
  <button id="btnAgain" class="btn big">다시 달리기</button><button id="btnHome" class="btn second">처음으로</button></div></section>

<section id="shop" class="screen">
  <div class="shop-top"><button id="btnBack" class="btn small second">돌아가기</button><div class="chip"><i class="coin"></i><b id="shCoins">0</b></div></div>
  <div class="sheet"><div class="tabs" id="tabs" role="tablist"></div><div class="grid" id="grid"></div></div>
  <div id="toast" class="toast"></div>
</section>

<script>
'use strict';

/* ================= math ================= */
const M4={
  id(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m},
  mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3]}return o},
  T(x,y,z){const m=M4.id();m[12]=x;m[13]=y;m[14]=z;return m},
  S(x,y,z){const m=M4.id();m[0]=x;m[5]=y===undefined?x:y;m[10]=z===undefined?x:z;return m},
  Rx(a){const m=M4.id(),c=Math.cos(a),s=Math.sin(a);m[5]=c;m[6]=s;m[9]=-s;m[10]=c;return m},
  Ry(a){const m=M4.id(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[2]=-s;m[8]=s;m[10]=c;return m},
  Rz(a){const m=M4.id(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[1]=s;m[4]=-s;m[5]=c;return m},
  chain(...ms){let o=ms[0];for(let i=1;i<ms.length;i++)o=M4.mul(o,ms[i]);return o},
  persp(fy,asp,n,f){const t=1/Math.tan(fy/2),m=new Float32Array(16);m[0]=t/asp;m[5]=t;m[10]=(f+n)/(n-f);m[11]=-1;m[14]=2*f*n/(n-f);return m},
  look(e,t,u){let zx=e[0]-t[0],zy=e[1]-t[1],zz=e[2]-t[2];let l=Math.hypot(zx,zy,zz);zx/=l;zy/=l;zz/=l;
    let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz);xx/=l;xy/=l;xz/=l;
    const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;const m=new Float32Array(16);
    m[0]=xx;m[1]=yx;m[2]=zx;m[4]=xy;m[5]=yy;m[6]=zy;m[8]=xz;m[9]=yz;m[10]=zz;
    m[12]=-(xx*e[0]+xy*e[1]+xz*e[2]);m[13]=-(yx*e[0]+yy*e[1]+yz*e[2]);m[14]=-(zx*e[0]+zy*e[1]+zz*e[2]);m[15]=1;return m},
  nrm(m){const a00=m[0],a01=m[1],a02=m[2],a10=m[4],a11=m[5],a12=m[6],a20=m[8],a21=m[9],a22=m[10];
    const b01=a22*a11-a12*a21,b11=-a22*a10+a12*a20,b21=a21*a10-a11*a20;let d=a00*b01+a01*b11+a02*b21;d=d?1/d:0;
    return new Float32Array([b01*d,b11*d,b21*d,(-a22*a01+a02*a21)*d,(a22*a00-a02*a20)*d,(-a21*a00+a01*a20)*d,(a12*a01-a02*a11)*d,(-a12*a00+a02*a10)*d,(a11*a00-a01*a10)*d])}
};
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)');
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), rnd=(a,b)=>a+Math.random()*(b-a);
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

/* ================= gl ================= */
const canvas=document.getElementById('c');
const glOpts={antialias:true,alpha:true,premultipliedAlpha:false};
let gl=canvas.getContext('webgl2',glOpts);
if(!gl){gl=canvas.getContext('webgl',glOpts)||canvas.getContext('experimental-webgl',glOpts);if(gl)gl.getExtension('OES_element_index_uint')}
const VS=`attribute vec3 aP;attribute vec3 aN;attribute vec2 aU;
uniform mat4 uVP;uniform mat4 uM;uniform mat3 uNM;uniform float uBend;
varying vec3 vN;varying vec2 vU;varying vec3 vW;varying vec3 vL;
void main(){vec4 w=uM*vec4(aP,1.0);w.x+=uBend*w.z*w.z;vW=w.xyz;vN=uNM*aN;vU=aU;vL=aP;gl_Position=uVP*w;}`;
const FS=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec3 vN;varying vec2 vU;varying vec3 vW;varying vec3 vL;
uniform sampler2D uTex;uniform float uUseTex;uniform vec4 uCol;uniform vec3 uEmis;uniform float uMode;uniform float uLit;
uniform vec3 uFogC;uniform vec2 uFog;uniform vec3 uCam;uniform float uTime;uniform float uScroll;
uniform vec3 uTint;uniform vec3 uSeaC;
vec3 hsv(float h,float s,float v){vec3 k=clamp(abs(mod(h*6.0+vec3(0.,4.,2.),6.)-3.)-1.,0.,1.);return v*mix(vec3(1.),k,s);}
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
void main(){
  vec3 n=normalize(vN);if(!gl_FrontFacing)n=-n;
  vec3 col=uCol.rgb;float a=uCol.a;
  if(uMode<0.5){ if(uUseTex>0.5){col*=texture2D(uTex,vU).rgb;} }
  else if(uMode<1.5){
    vec2 p=vW.xz;float q=p.y-uScroll*0.6;
    float w=sin(p.x*0.45+uTime*1.1)*sin(q*0.32+uTime*0.6);
    float w2=sin(p.x*1.4+q*0.9+uTime*2.0);
    col=mix(uSeaC,uSeaC*1.7+0.09,0.5+0.32*w+0.12*w2);

async function loadAll(){
  const list=[['penguin','penguin'],['seal','monster_seal'],['bear','monster_bear'],['puff','monster_purple_puff'],['snow','monster_snowman'],
    ['donut','donut'],['building','building'],['ice','ice_block'],['coin','coin']];
  let done=0;const lb=document.getElementById('lbar');
  // 병렬로 받는다. loadGLB의 GL 호출은 await 뒤에 한 덩어리로 붙어 있어 섞이지 않는다
  const raws=Object.fromEntries(await Promise.all(list.map(async([k,f])=>{
    const res=await fetch(`models/${f}.glb`);
    if(!res.ok)throw new Error(`model ${f}: ${res.status}`);
    const r=await loadGLB(new Uint8Array(await res.arrayBuffer()));
    lb.style.width=(++done/list.length*100)+'%';
    return [k,r];
  })));
  M.penguin=fitModel(raws.penguin,{h:1.15});
  for(const m of MONSTERS)M[m.key]=fitModel(raws[m.key],{h:m.h});
  M.donut=fitModel(raws.donut,{h:1.26});
  M.building=fitModel(raws.building,{w:2.05,h:2.7,d:1.6});
  M.ice=fitModel(raws.ice,{w:1.18,h:1.02,d:0.98});
  M.coin=fitModel(raws.coin,{h:0.62});
  PR={box:geo(gBox()),sph:geo(gSphere(24,16)),hemi:geo(gSphere(24,10,Math.PI/2)),cone:geo(gCyl(0,1,24,true)),cyl:geo(gCyl(1,1,28,true)),
    tube:geo(gCyl(1,1,32,false)),roadZ:geo(gBoxZ(40)),torus:geo(gTorus(.24,36,14)),plane:geo(gPlane()),heart:geo(gHeart()),bank:geo(gCyl(1,1,20,false))};
  computeAnchors();
}
function computeAnchors(){
  const m=M.penguin,P=m.raw.P,H=m.h;const pts=[];
  for(let i=0;i<P.length;i+=3)pts.push([(P[i]-m.cx)*m.sx,(P[i+1]-m.mny)*m.sy,(P[i+2]-m.cz)*m.sz]);
  const band=(y,dy,f)=>{let v=-1e9;for(const p of pts)if(Math.abs(p[1]-y)<dy){const r=f(p);if(r>v)v=r}return v};
  const top=band(H,0.06,p=>p[1]);
  const eyeY=H*0.79;
  const headR=band(H*0.84,0.04,p=>Math.abs(p[0]));
  const lensX=headR*0.38;
  let faceZ=-1e9;for(const p of pts)if(Math.abs(p[1]-eyeY)<0.05&&Math.abs(Math.abs(p[0])-lensX)<0.05)faceZ=Math.max(faceZ,p[2]);
  const neckY=H*0.68;      // 0.6은 목이 아니라 배였다
  const neckX=band(neckY,0.03,p=>Math.abs(p[0])),neckZ=band(neckY,0.03,p=>Math.abs(p[2]));
  A_={H,top,eyeY,headR,lensX,faceZ,neckY,neckX,neckZ};
}

let state='loading',time=0,scroll=0;
const pg={lane:1,x:0,y:0,vy:0,slip:0,inv:0,tilt:0,rot:0,queued:0,qT:0,dead:false,turn:0,slide:0,fell:false};
let speed=0,dist=0,runCoins=0,spawnAcc=0,obs=[],parts=[],bergs=[],shake=0,camBlend=0,overT=0,showRot=0,introT=0;
const SPAWN_Z=-108;

function resetRun(){
  Object.assign(pg,{lane:1,x:0,y:0,vy:0,slip:0,inv:0,tilt:0,rot:0,queued:0,qT:0,dead:false,turn:camBlend>0.5?1:0,slide:0,fell:false});
  speed=0;dist=0;runCoins=0;spawnAcc=0;obs=[];parts=[];shake=0;overT=0;introT=0;
  themeIdx=themeFrom=0;themeBlend=1;applyTheme();
  let z=-30;while(z>SPAWN_Z){spawnRow(z,true);z-=16}
}
function makeObs(type,lane,z,extra){
  const o={type,lane,x:LANES[lane],z,y:0,hit:false,dead:false,ph:Math.random()*6,vx:0,vy:0,spin:0,rx:0,rz:0,ry:0};
  if(type==='mon'){o.m=extra;o.h=MONSTERS[extra].h*0.72;o.d=0.78}
  else if(type==='donut'){o.h=0.95;o.d=0.6;o.roll=0}
  else if(type==='building'){o.h=99;o.d=M.building.d}
  else if(type==='ice'){o.h=M.ice.h;o.d=M.ice.d;o.y=ICE_Y}
  else if(type==='coin'){o.h=0.6;o.d=0.5}
  else if(type==='arch'){o.h=99;o.d=0.36;o.x=0}
  else if(type==='gap'){o.h=0;o.d=0;o.x=0;o.len=GAP_LEN}
  obs.push(o);return o;
}
function coinTrail(lane,z,n){for(let k=0;k<n;k++)makeObs('coin',lane,z-k*2.0)}
function spawnRow(z,easy){
  const d=dist;let n=1;
  if(!easy){
    const k=Math.random();
    // 끊긴 길: 코인을 구멍 위에 걸쳐 둬서 "여기서 점프" 신호를 준다
    // 미끄덩 중엔 점프·슬라이딩이 막히므로 구멍/게이트는 건너뛴다 (내보내면 피할 방법이 없어 확정 사망)
    if(d>260&&k<0.15&&pg.slip<=0){makeObs('gap',1,z);const cl=Math.floor(Math.random()*3);for(let i=-1;i<=1;i++)makeObs('coin',cl,z+i*1.5);return}
    // 슬라이딩 게이트
    if(d>120&&k<0.32&&pg.slip<=0){makeObs('arch',1,z);coinTrail(Math.floor(Math.random()*3),z-1.0,4);return}
    if(d>600)n=Math.random()<.6?2:1;else if(d>150)n=Math.random()<.4?2:1}
  const lanes=[0,1,2].sort(()=>Math.random()-.5);const used=lanes.slice(0,n),free=lanes.slice(n);
  for(const l of used){
    const r=Math.random();let t;
    if(d<60||easy)t=r<.8?'mon':'donut';
    else t=r<.5?'mon':r<.75?'donut':'building';
    if(t==='mon')makeObs('mon',l,z,Math.floor(Math.random()*MONSTERS.length));else makeObs(t,l,z);
  }
  if(Math.random()<(easy?.5:.38)){const l=free[Math.floor(Math.random()*free.length)];makeObs('ice',l,z+(Math.random()<.5?0:-4))}
  if(free.length&&Math.random()<.6){const l=free[Math.floor(Math.random()*free.length)];coinTrail(l,z-5,4+Math.floor(Math.random()*3))}
}
function initBergs(){bergs=[];for(let i=0;i<16;i++)bergs.push(newBerg(rnd(-130,10)))}
function newBerg(z){const side=Math.random()<.5?-1:1;const big=Math.random()<.35;
  return{x:side*rnd(big?14:6.5,big?40:22),z,s:big?rnd(2.6,4.8):rnd(0.7,1.7),h:big?rnd(1.3,2.6):rnd(0.3,0.8),r:rnd(0,6),floe:!big&&Math.random()<.5}}

/* ================= input ================= */
let tStart=null;
function laneMove(dir){
  if(state!=='run'||pg.dead)return;
  if(pg.slip>0){pg.queued=dir;pg.qT=0.18;return}
  pg.lane=clamp(pg.lane+dir,0,2);
}
function jump(){if(state!=='run'||pg.dead||pg.slip>0)return;if(pg.y<=0.001){pg.vy=9.0;pg.slide=0;SFX.jump()}}
function slide(){if(state!=='run'||pg.dead||pg.slip>0)return;pg.slide=0.62;if(pg.y>0.001)pg.vy=Math.min(pg.vy,-13);SFX.crack()}
window.addEventListener('pointerdown',e=>{if(state!=='run'||e.target.closest('button'))return;tStart={x:e.clientX,y:e.clientY,fired:false,t:time}});
window.addEventListener('pointermove',e=>{if(!tStart||tStart.fired)return;const dx=e.clientX-tStart.x,dy=e.clientY-tStart.y;
  if(Math.abs(dx)>26&&Math.abs(dx)>Math.abs(dy)){laneMove(dx>0?1:-1);tStart.fired=true}
  else if(dy<-30&&Math.abs(dy)>Math.abs(dx)){jump();tStart.fired=true}
  else if(dy>30&&Math.abs(dy)>Math.abs(dx)){slide();tStart.fired=true}});
window.addEventListener('pointerup',e=>{if(!tStart)return;if(!tStart.fired)jump();tStart=null});
window.addEventListener('pointercancel',()=>{tStart=null});
window.addEventListener('keydown',e=>{if(state!=='run')return;if(e.key==='ArrowLeft')laneMove(-1);else if(e.key==='ArrowRight')laneMove(1);else if(e.key===' '||e.key==='ArrowUp'){jump();e.preventDefault()}else if(e.key==='ArrowDown'){slide();e.preventDefault()}});

/* ================= effects ================= */
function burst(x,y,z,n,col,size,alpha){for(let i=0;i<n;i++)parts.push({k:'shard',x,y,z,vx:rnd(-3,3),vy:rnd(2,6),vz:rnd(-1,3),r:rnd(0,6),rv:rnd(-10,10),s:size*rnd(.6,1.2),life:rnd(.5,.9),t:0,col,alpha})}
function coinPop(x,y,z,n){for(let i=0;i<n;i++)parts.push({k:'coin',x,y,z,vx:(i-(n-1)/2)*1.2,vy:rnd(6,7.5),vz:2.5,r:0,rv:12,s:1,life:.85,t:0})}
function popText(t){const el=document.getElementById('pop');el.textContent=t;el.classList.remove('go');void el.offsetWidth;el.classList.add('go')}

/* ================= update ================= */
function update(dt){
  if(state==='pause')dt=0;   // 멈추면 바다·빙산·애니메이션까지 전부 멈춘다
  time+=dt;
  if(shake>0)shake=Math.max(0,shake-dt*2.5);   // 모든 상태에서 감쇠 (over/start에서 멈춰 있던 버그)
  for(const b of bergs){b.z+=(state==='run'?speed:1.2)*dt;if(b.z>14)Object.assign(b,newBerg(rnd(-140,-120)))}
  scroll+=(state==='run'?speed:1.2)*dt;
  if(state==='start'||state==='shop'){camBlend=Math.max(0,camBlend-dt*2);showRot=state==='shop'?showRot+dt*0.9:lerp(showRot,0,1-Math.exp(-dt*6));return}
  if(state==='pause')return;
  if(state==='over'){overT+=dt;pg.tilt=lerp(pg.tilt,Math.PI/2,1-Math.exp(-dt*8));const ny=pg.y+pg.vy*dt;pg.y=pg.fell?ny:Math.max(0,ny);pg.vy-=21*dt;
    stepParts(dt);for(const o of obs)if(o.hit)stepKnock(o,dt);return}
  // run
  introT+=dt;pg.turn=Math.min(1,pg.turn+dt/0.7);camBlend=Math.min(1,camBlend+dt*1.4);
  const target=Math.min(24,9+dist/70);speed=introT<1?lerp(0,target,ease(introT)):target;
  dist+=speed*dt;updateTheme(dt);
  // 쓸기 판별 때문에 점프는 손 뗄 때 발동한다. 꾹 누르고 있으면 영영 안 뛰므로 0.14초에서 끊는다
  if(tStart&&!tStart.fired&&time-tStart.t>0.14){jump();tStart.fired=true}
  // penguin
  if(pg.qT>0){pg.qT-=dt;if(pg.qT<=0&&pg.queued){pg.lane=clamp(pg.lane+pg.queued,0,2);pg.queued=0}}
  const tx=LANES[pg.lane];pg.x+=(tx-pg.x)*(1-Math.exp(-dt*(pg.slip>0?5:16)));
  pg.vy-=21*dt;pg.y+=pg.vy*dt;if(pg.y<=0){pg.y=0;pg.vy=0}
  if(pg.inv>0)pg.inv-=dt;
  if(pg.slip>0){pg.slip-=dt;if(pg.slip<=0){pg.slip=0;popText('다시 일어났다!')}}
  if(pg.slide>0)pg.slide-=dt;
  pg.tilt=lerp(pg.tilt,pg.slip>0?0.5:(pg.slide>0?-1.15:0),1-Math.exp(-dt*12));   // 0.5rad: 더 눕히면 펭귄이 길을 가린다
  // spawn
  spawnAcc+=speed*dt;const gap=speed*Math.max(.72,1.45-dist/1600);
  if(spawnAcc>=gap){spawnAcc=0;spawnRow(SPAWN_Z,false)}
  // obstacles
  for(const o of obs){
    if(o.hit){stepKnock(o,dt);continue}
    const pz=o.z;                                  // 스윕 판정용: 이번 프레임 전 위치
    o.z+=speed*dt+(o.type==='donut'?3*dt:0);
    if(o.type==='donut')o.roll+=dt*(speed+3)/0.46;
    if(o.z>(o.type==='coin'?1.6:12))o.dead=true;
    if(o.type==='gap'){if(!pg.dead&&pg.y<=0.02&&Math.abs(o.z)<o.len/2-0.2)gapFall();continue}
    // 20fps에서는 한 프레임에 1.2m를 간다. 점으로 재면 판정 창이 좁은 게이트를 그냥 지나친다
    const half=0.32+o.d/2;
    if(pz-half<=0&&o.z+half>=0&&(o.type==='arch'||Math.abs(o.x-pg.x)<0.72))collide(o);
  }
  obs=obs.filter(o=>!o.dead);
  stepParts(dt);
  hud();
}
function gapFall(){if(pg.dead)return;burst(pg.x,0.4,0,12,[0.8,0.92,1],0.12,.9);shake=0.6;gameOver(true)}
function stepKnock(o,dt){if(o.type==='building'||o.type==='arch'){o.z+=(state==='run'?speed:0)*dt;if(o.z>12)o.dead=true;return}o.vy-=18*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.z+=(state==='run'?speed:0)*dt+o.vz*dt;o.rx+=o.spin*dt;o.rz+=o.spin*.6*dt;if(o.y<-6||o.z>14)o.dead=true}
function stepParts(dt){for(const p of parts){p.t+=dt;p.vy-=(p.k==='coin'?14:16)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=(p.vz+(state==='run'?speed*.5:0))*dt;p.r+=p.rv*dt}parts=parts.filter(p=>p.t<p.life)}
function collide(o){
  if(o.type==='coin'){o.dead=true;runCoins++;save.coins++;SFX.coin();coinPop(o.x,0.7,o.z,1);return}
  if(o.type==='ice'){
    // 공중에 떠 있음: 점프해서 몸이 닿아야 깨진다. 밑으로 지나가면 그냥 통과.
    if(pg.y+A_.H<o.y||pg.y>o.y+o.h)return;
    o.hit=true;o.dead=true;
    burst(o.x,o.y+o.h/2,o.z,16,[0.75,0.9,1],0.15,.85);SFX.crack();
    runCoins+=3;save.coins+=3;coinPop(o.x,o.y,o.z,3);SFX.coin();popText('+3 코인!');
    if(pg.vy<3)pg.vy=4.5;
    return;
  }
  if(pg.inv>0)return;
  if(o.type==='arch'){if(pg.slide>0)return}         // 슬라이딩으로 통과
  else if(o.type!=='building'&&pg.y>o.h-0.08)return;   // jumped over
  // hit
  const dir=o.x>pg.x+0.05?1:o.x<pg.x-0.05?-1:(Math.random()<.5?-1:1);
  o.hit=true;o.vx=dir*rnd(4,6);o.vy=6;o.vz=-1;o.spin=rnd(6,10);
  burst(pg.x,0.6,0,10,[1,1,1],0.1,1);shake=1;SFX.hit();try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
  if(pg.slip>0){gameOver();return}
  if(o.type==='building'){pg.lane=pg.lane===1?(Math.random()<.5?0:2):1;pg.queued=0}
  if(o.type==='arch')pg.slide=0;
  pg.slip=5;pg.inv=1.1;pg.vy=Math.min(pg.vy,0);popText('미끄덩!');
}
function gameOver(fell){
  pg.dead=true;state='over';pg.fell=!!fell;pg.vy=fell?-2:4;SFX.over();
  const nb=Math.floor(dist)>save.best;if(nb)save.best=Math.floor(dist);persist();
  setTimeout(()=>{if(state!=='over')return;
    document.getElementById('oDist').textContent=Math.floor(dist);document.getElementById('oBest').textContent=save.best;
    document.getElementById('oCoins').textContent=runCoins;document.getElementById('oNew').classList.toggle('show',nb);syncEnergyUI();
    showScreen('over')},900);
}

/* ================= render ================= */
let W=1,H=1;
function resize(){const dpr=Math.min(2,window.devicePixelRatio||1);W=Math.floor(innerWidth*dpr);H=Math.floor(innerHeight*dpr);canvas.width=W;canvas.height=H}
window.addEventListener('resize',resize);
function camera(){
  const asp=W/H;
  const showTarget=state==='shop'?[0,-0.5,0]:[0,0.52,0];
  const showEye=state==='shop'?[0,0.8,3.9]:[0,0.95,3.45];
  const cx=pg.x*0.55;
  const runEye=[cx,3.5,6.4],runTarget=[cx,0.55,-8];
  const b=ease(camBlend);
  const eye=[lerp(showEye[0],runEye[0],b),lerp(showEye[1],runEye[1],b),lerp(showEye[2],runEye[2],b)];
  const tg=[lerp(showTarget[0],runTarget[0],b),lerp(showTarget[1],runTarget[1],b),lerp(showTarget[2],runTarget[2],b)];
  if(shake>0&&!REDUCE.matches){const s=shake*0.12;eye[0]+=Math.sin(time*60)*s;eye[1]+=Math.cos(time*53)*s}
  const fov=(asp<0.75?62:52)*Math.PI/180;
  const VP=M4.mul(M4.persp(fov,asp,0.1,150),M4.look(eye,tg,[0,1,0]));
  return{VP,eye};
}
function roadSeg(a,b){const L=b-a;if(L<=0.02)return;const cz=(a+b)/2;
  draw(PR.roadZ,M4.mul(M4.T(0,-0.45,cz),M4.S(ROAD_HALF*2,0.9,L)),{mode:2});
  for(const s of[-1,1])draw(PR.roadZ,M4.mul(M4.T(s*ROAD_HALF,0.06,cz),M4.S(0.3,0.42,L)),{col:[0.97,0.99,1,1]});}
function drawRoad(){
  const gaps=obs.filter(o=>o.type==='gap'&&!o.dead).sort((a,b)=>a.z-b.z);
  let z0=-155;
  for(const g of gaps){const gs=g.z-g.len/2,ge=g.z+g.len/2;if(gs>z0)roadSeg(z0,gs);z0=Math.max(z0,ge)}
  if(z0<15)roadSeg(z0,15);
}
function render(){
  gl.viewport(0,0,W,H);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  const {VP,eye}=camera();
  gl.uniformMatrix4fv(U.uVP,false,VP);gl.uniform3f(U.uCam,eye[0],eye[1],eye[2]);gl.uniform1f(U.uTime,time);gl.uniform1f(U.uScroll,scroll);
  gl.uniform1f(U.uBend,(Math.sin(scroll*0.010)*0.85+Math.sin(scroll*0.0041)*0.5)*BEND);
  gl.uniform3f(U.uTint,curTint[0],curTint[1],curTint[2]);
  gl.uniform3f(U.uSeaC,curSea[0],curSea[1],curSea[2]);
  gl.uniform3f(U.uFogC,curFog[0],curFog[1],curFog[2]);
  gl.disable(gl.BLEND);gl.depthMask(true);
  // sea, road, banks
  draw(PR.plane,M4.mul(M4.T(0,-0.5,-40),M4.S(420,1,420)),{mode:1});
  drawRoad();
  for(const b of bergs){
    if(b.floe)draw(PR.cyl,M4.chain(M4.T(b.x,-0.5,b.z),M4.Ry(b.r),M4.S(b.s,0.12,b.s*0.7)),{col:[0.93,0.97,1,1]});
    else draw(PR.sph,M4.chain(M4.T(b.x,-0.5,b.z),M4.Ry(b.r),M4.S(b.s,b.h,b.s*0.8)),{col:[0.93,0.97,1,1]});
  }
  // penguin
  const running=state==='run'||state==='over'||state==='pause';
  const bob=(running&&pg.y===0&&pg.slip===0&&!pg.dead)?Math.abs(Math.sin(time*13))*0.06:Math.abs(Math.sin(time*3))*0.02;
  const wad=(running&&pg.slip===0&&!pg.dead)?Math.sin(time*13)*0.13:Math.sin(time*2.2)*0.05;
  let ry=running?lerp(0,Math.PI,ease(pg.turn)):showRot;
  if(pg.slip>0)ry+=Math.sin(time*7)*0.25;
  const lift=Math.abs(Math.sin(pg.tilt))*0.38,fwd=Math.sin(pg.tilt)*0.5;
  const B=M4.chain(M4.T(running?pg.x:0,pg.y+bob+lift,running?fwd:0),M4.Ry(ry),M4.Rx(pg.tilt),M4.Rz(wad));
  const blink=pg.inv>0&&state==='run'&&Math.floor(time*14)%2===0;
  if(!blink)drawPenguin(B);
  // obstacles (opaque)
  for(const o of obs){if(o.type==='ice')continue;drawObs(o)}
  // coin particles
  for(const p of parts)if(p.k==='coin'){const s=1-Math.max(0,(p.t-.55)/.3);draw(M.coin.mesh,M4.chain(M4.T(p.x,p.y,p.z),M4.Ry(p.r),M4.S(Math.max(.01,s)),M.coin.nm),{emis:[0.12,0.09,0.02]})}
  // transparent: shadows, ice, shards
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);
  const shy=0.012;
  const ps=1/(1+pg.y*0.9);draw(PR.plane,M4.chain(M4.T(running?pg.x:0,shy,running?fwd*0.5:0),M4.S(0.95*ps,1,0.8*ps)),{mode:4,col:[0,0,0,0.42]});
  for(const o of obs){if(o.hit)continue;
    if(o.type==='mon'||o.type==='donut')draw(PR.plane,M4.chain(M4.T(o.x,shy,o.z),M4.S(o.type==='donut'?0.9:1.15,1,0.7)),{mode:4,col:[0,0,0,0.32]});
    else if(o.type==='ice')draw(PR.plane,M4.chain(M4.T(o.x,shy,o.z),M4.S(0.62,1,0.44)),{mode:4,col:[0,0,0,0.20]});}
  const ices=obs.filter(o=>o.type==='ice').sort((a,b)=>a.z-b.z);
  gl.depthMask(true);
  for(const o of ices)drawObs(o);
  gl.depthMask(false);
  for(const p of parts)if(p.k==='shard'){const a=p.alpha*(1-p.t/p.life);draw(PR.box,M4.chain(M4.T(p.x,p.y,p.z),M4.Rx(p.r),M4.Rz(p.r*.7),M4.S(p.s)),{col:[p.col[0],p.col[1],p.col[2],a]})}
  gl.depthMask(true);gl.disable(gl.BLEND);
}
function drawObs(o){
  if(o.type==='mon'){const mm=M[MONSTERS[o.m].key];const t=time*6+o.ph;
    const B=M4.chain(M4.T(o.x,o.y+Math.abs(Math.sin(t))*0.08,o.z),M4.Rx(o.rx),M4.Rz(o.rz+Math.sin(t)*0.1));
    draw(mm.mesh,M4.mul(B,mm.nm),{col:MONSTERS[o.m].col})}
  else if(o.type==='donut'){const r=M.donut.h/2;const hop=Math.abs(Math.sin(o.roll*0.5))*0.1;
    const B=M4.chain(M4.T(o.x,o.y+r+hop,o.z),M4.Rx(o.rx),M4.Rz(-o.roll*0.35+o.rz),M4.T(0,-r,0));draw(M.donut.mesh,M4.mul(B,M.donut.nm))}
  else if(o.type==='building'){const B=M4.chain(M4.T(o.x,o.y,o.z),M4.Rz(o.rz*0.2));draw(M.building.mesh,M4.mul(B,M.building.nm))}
  else if(o.type==='ice'){const B=M4.chain(M4.T(o.x,o.y+Math.sin(time*2.2+o.ph)*0.08,o.z),M4.Ry(time*0.8+o.ph));
    const gl2=0.07+0.05*Math.sin(time*4+o.ph);
    draw(M.ice.mesh,M4.mul(B,M.ice.nm),{col:[1,1,1,0.8],emis:[gl2,gl2*1.2,gl2*1.4]})}
  else if(o.type==='coin'){draw(M.coin.mesh,M4.chain(M4.T(o.x,0.58+Math.sin(time*3+o.ph)*0.07,o.z),M4.Ry(time*2.6+o.ph),M.coin.nm),{emis:[0.14,0.10,0.02]})}
  else if(o.type==='arch'){const W=ROAD_HALF,bt=0.42,wood={col:[0.46,0.30,0.18,1]},rope={col:[0.88,0.80,0.62,1]};
    for(const s of[-1,1]){draw(PR.box,M4.chain(M4.T(s*(W-0.14),(ARCH_CLEAR+bt)/2,o.z),M4.S(0.3,ARCH_CLEAR+bt,0.3)),wood);
      draw(PR.box,M4.chain(M4.T(s*(W-0.14),ARCH_CLEAR-0.1,o.z),M4.S(0.38,0.14,0.38)),rope)}
    draw(PR.box,M4.chain(M4.T(0,ARCH_CLEAR+bt/2,o.z),M4.S(W*2,bt,0.34)),wood);}
}

/* ================= UI ================= */
const $=id=>document.getElementById(id);
function showScreen(id){for(const s of document.querySelectorAll('.screen'))s.classList.toggle('show',s.id===id)}
let lastHud='',ctxLost=false;
function hud(){
  const d=Math.floor(dist)+'',c=save.coins+'',key=d+'|'+c;
  if(key!==lastHud){$('hDist').textContent=d;$('hCoins').textContent=c;lastHud=key}
  const sl=$('slip');if(pg.slip>0){sl.classList.add('show');$('slipBar').style.width=(pg.slip/5*100)+'%'}else sl.classList.remove('show');
}
const HINT='옆으로 쓸면 줄 바꾸기 · 톡 누르면 점프<br>아래로 쓸면 슬라이딩';
function syncEnergyUI(){
  refillCheck();
  const e=save.energy,out=e<=0;
  const dots='●'.repeat(e)+'○'.repeat(MAX_ENERGY-e);
  const refill=`내일 아침 ${DAY_START_H}시에 ${MAX_ENERGY}판이 다시 채워져요<br>(${fmtLeft(nextRefill())} 뒤)`;
  $('sEnergy').textContent=dots;
  for(const [id,txt] of [['btnPlay','달리기 시작'],['btnAgain','다시 달리기']]){
    const b=$(id);b.disabled=out;b.textContent=out?'오늘은 여기까지!':txt}
  $('hint').classList.toggle('locked',out);
  $('hint').innerHTML=out?refill:HINT;
  $('oEnergy').innerHTML=out?refill:`오늘 남은 판 ${dots}`;   // 게임오버 화면에서도 언제 다시 되는지 보인다
}
function refreshStart(){syncEnergyUI();$('sBest').textContent=save.best;$('sCoins').textContent=save.coins;$('btnSound').textContent=save.sound?'🔊':'🔇';$('btnSound').setAttribute('aria-label',save.sound?'소리 끄기':'소리 켜기')}
function goStart(){state='start';obs=[];parts=[];
  themeIdx=themeFrom=0;themeBlend=1;applyTheme();   // 밤 구간에서 죽어도 시작/상점 화면은 낮으로 되돌린다
  Object.assign(pg,{x:0,y:0,vy:0,slip:0,inv:0,tilt:0,dead:false});refreshStart();showScreen('start')}
function startRun(){if(save.energy<=0){syncEnergyUI();return}save.energy--;persist();resetRun();state='run';lastHud='';$('hBest').textContent=save.best;$('hCoins').textContent=save.coins;$('hDist').textContent='0';showScreen('hud')}
$('btnPlay').onclick=()=>{SFX.click();startRun()};
$('btnShop').onclick=()=>{SFX.click();state='shop';showRot=0;renderShop();showScreen('shop')};
$('btnSound').onclick=()=>{save.sound=!save.sound;persist();refreshStart();SFX.click()};
function pauseGame(){if(state!=='run')return;state='pause';persist();if(actx)actx.suspend();showScreen('pause')}
$('btnPause').onclick=()=>pauseGame();
$('btnResume').onclick=()=>{state='run';if(actx)actx.resume();showScreen('hud')};
$('btnQuit').onclick=()=>{persist();camBlend=1;goStart()};
$('btnAgain').onclick=()=>{SFX.click();startRun()};
$('btnHome').onclick=()=>{SFX.click();goStart()};
$('btnBack').onclick=()=>{SFX.click();goStart()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
// GL 컨텍스트를 잃으면(모바일에서 백그라운드 다녀올 때) 검은 화면으로 굳는다. 알리고, 돌아오면 새로 연다
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();ctxLost=true;pauseGame();
  document.querySelector('#loading p').textContent='화면을 잠깐 잃었어요. 다시 그리는 중…';showScreen('loading')});
canvas.addEventListener('webglcontextrestored',()=>location.reload());

let curCat='hat';
function renderShop(){
  $('shCoins').textContent=save.coins;
  $('tabs').innerHTML=CATS.map(([k,n])=>`<button role="tab" aria-selected="${k===curCat}" data-cat="${k}">${n}</button>`).join('');
  const items=ITEMS.filter(i=>i.cat===curCat);const eq=save.eq[curCat];
  let h=`<button class="item${eq?'':' on'}" data-none="1"><span class="ic">🚫</span><span>없음</span><span class="st">${eq?'벗기':'선택됨'}</span></button>`;
  for(const it of items){const own=save.owned.includes(it.id),on=eq===it.id;
    const st=on?'입는 중':own?'입기':`<i class="coin"></i>${it.price}`;
    const poor=!own&&save.coins<it.price;
    h+=`<button class="item${on?' on':''}${poor?' poor':''}" data-id="${it.id}"><span class="ic">${it.icon}</span><span>${it.name}</span><span class="st">${st}</span></button>`}
  $('grid').innerHTML=h;
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;curCat=b.dataset.cat;SFX.click();renderShop()});
let toastT=0;function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1600)}
$('grid').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.none){save.eq[curCat]=null;persist();SFX.click();renderShop();return}
  const it=ITEMS.find(i=>i.id===b.dataset.id);if(!it)return;
  if(save.owned.includes(it.id)){save.eq[curCat]=save.eq[curCat]===it.id?null:it.id;persist();SFX.click();renderShop();return}
  if(save.coins>=it.price){save.coins-=it.price;save.owned.push(it.id);save.eq[curCat]=it.id;persist();SFX.buy();toast(`${it.name} 샀어요!`);renderShop()}
  else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');toast(`코인이 ${it.price-save.coins}개 더 필요해요`)}
});

/* ================= boot ================= */
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let last=0;
function frame(ts){const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;update(dt);if(!ctxLost)render();requestAnimationFrame(frame)}
(async()=>{
  try{
    if(!gl)throw new Error('nogl');
    resize();initGL();await loadAll();initBergs();resetRun();obs=[];refillCheck();
    goStart();requestAnimationFrame(t=>{last=t;frame(t)});
  }catch(err){console.error(err);document.querySelector('#loading p').textContent=
    err.message==='nogl'?'이 기기에서는 3D 화면을 열 수 없어요. 다른 브라우저로 열어 주세요.'
                        :'펭귄을 불러오지 못했어요. 인터넷을 확인하고 새로고침해 주세요.'}
})();
</script>
